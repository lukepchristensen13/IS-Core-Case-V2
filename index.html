<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYU IS Career Launchpad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E2C5A;
    --navy-deep:#081C3B;
    --white:#FFFFFF;
    --ink:#0E2C5A;
    --ink-soft:#43526B;
    --paper:#EEF1F6;
    --paper-raised:#FFFFFF;
    --line:#D4DAE4;
    --gold:#0E2C5A;
    --gold-deep:#081C3B;
    --teal:#0E2C5A;
    --teal-soft:#E4E9F2;
    --danger:#A3432E;
    --royal:#2A4FD9;
    --radius-card: 2px;
    --serif: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --sans: 'Inter', -apple-system, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }

  /* ---------- Shell ---------- */
  .shell{ max-width:960px; margin:0 auto; padding:0 24px 80px; }
  header.top{
    background: var(--navy);
    padding:0 0 22px;
  }
  .brand-inner{
    max-width:960px;
    margin:0 auto;
    padding:28px 24px 22px;
  }
  .brand{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
  }
  .brand-left{
    display:flex; align-items:center; gap:18px;
  }
  .brand-left img{
    height:40px;
    width:auto;
    display:block;
  }
  .brand-left .divider{
    width:1px; height:34px; background:rgba(255,255,255,.3);
  }
  .brand h1{
    font-family:var(--serif);
    font-weight:800;
    font-size:24px;
    margin:0;
    letter-spacing:-0.01em;
    color:var(--white);
    text-transform:uppercase;
  }
  .brand .tag{
    font-size:13px;
    color:rgba(255,255,255,.75);
    max-width:280px;
    text-align:right;
  }

  nav.tabs{
    display:flex; gap:2px;
    max-width:960px;
    margin:0 auto;
    padding:0 24px;
  }
  nav.tabs button{
    font-family:var(--sans);
    font-weight:600;
    font-size:14.5px;
    padding:11px 20px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    border-bottom:none;
    cursor:pointer;
    color:rgba(255,255,255,.75);
    position:relative;
    top:1px;
  }
  nav.tabs button.active{
    background:var(--paper-raised);
    color:var(--navy);
    border-color:rgba(255,255,255,.25);
  }
  .panel-wrap{
    border:1px solid var(--line);
    background:var(--paper-raised);
    padding:36px;
    min-height:420px;
  }
  @media (max-width:640px){
    .panel-wrap{ padding:20px; }
    .brand .tag{ display:none; }
  }

  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- Discovery: grid ---------- */
  .discover-intro{ margin-bottom:28px; }
  .discover-intro h2{
    font-family:var(--serif);
    font-size:22px;
    margin:0 0 6px;
  }
  .discover-intro p{
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:60ch;
    margin:0;
  }
  /* ---------- Paw-print navigation ---------- */
  .paws-wrap{
    display:flex; gap:28px; flex-wrap:wrap; justify-content:center; align-items:flex-start;
    margin-bottom:40px; padding:12px 0 4px;
  }
  .paw-group{ display:flex; flex-direction:column; align-items:center; }
  .paw{
    position:relative; width:260px; height:225px;
  }
  .paw-heel{
    position:absolute; left:50%; bottom:0; transform:translateX(-50%) rotate(-2deg);
    width:150px; height:104px; background:var(--navy);
    border:1.5px solid var(--royal);
    border-radius:58% 62% 55% 60% / 60% 55% 65% 55%;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:8px;
  }
  .paw-heel span{
    color:var(--white); font-family:var(--sans); font-weight:700; font-size:12px;
    text-transform:uppercase; letter-spacing:.04em; line-height:1.35;
  }
  .toe{
    position:absolute; width:76px; height:66px; cursor:pointer;
    background:var(--navy); color:var(--white); font-family:var(--sans); font-weight:600; font-size:11.5px;
    border:1.5px solid var(--royal);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:6px;
    border-radius:60% 55% 65% 50% / 55% 60% 50% 65%;
    transition:transform .15s ease, background .15s ease;
    line-height:1.25;
  }
  .toe:hover, .toe:focus-visible{ background:var(--gold-deep); outline:none; }
  .toe.pos-0{ left:0; top:74px; transform:rotate(-14deg); }
  .toe.pos-1{ left:62px; top:16px; transform:rotate(-5deg); }
  .toe.pos-2{ left:132px; top:12px; transform:rotate(5deg); }
  .toe.pos-3{ left:196px; top:68px; transform:rotate(14deg); }
  .toe.pos-0:hover{ transform:rotate(-14deg) scale(1.08); }
  .toe.pos-1:hover{ transform:rotate(-5deg) scale(1.08); }
  .toe.pos-2:hover{ transform:rotate(5deg) scale(1.08); }
  .toe.pos-3:hover{ transform:rotate(14deg) scale(1.08); }
  @media (max-width:640px){
    .paws-wrap{ gap:20px; }
    .paw{ transform:scale(.85); transform-origin:top center; height:195px; }
  }

  /* ---------- Comparison table ---------- */
  .compare-block{ margin-top:10px; }
  .compare-block h3{ font-family:var(--serif); font-size:17px; margin:0 0 10px; }
  .help-block{
    border:1px solid var(--line); background:var(--paper);
    padding:18px 20px; margin-bottom:32px;
  }
  .help-block h3{ font-family:var(--serif); font-size:16px; margin:0 0 6px; color:var(--navy); }
  .help-block p{ font-size:13.5px; color:var(--ink-soft); margin:0; max-width:70ch; }
  .help-block a{ color:var(--navy); font-weight:600; text-decoration:underline; }
  .help-block a:hover{ color:var(--gold-deep); }
  .compare-table{ border:1px solid var(--line); }
  .compare-row{
    display:grid; grid-template-columns: 1.5fr 1.6fr 1.7fr 0.7fr;
    gap:1px; background:var(--line);
  }
  .compare-row > div{ background:var(--paper-raised); padding:10px 12px; font-size:12.5px; }
  .compare-row.head > div{
    font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-soft); background:var(--paper);
  }
  @media (max-width:640px){
    .compare-row{ grid-template-columns:1fr; }
    .compare-row > div{ border-bottom:1px solid var(--line); }
  }

  /* ---------- Dossier detail ---------- */
  .dossier{ display:none; }
  .dossier.active{ display:block; }
  .back-link{
    background:none;border:none;cursor:pointer;
    font-family:var(--sans); font-size:13.5px; color:var(--ink-soft);
    padding:0 0 22px; display:flex; align-items:center; gap:6px;
  }
  .back-link:hover{ color:var(--ink); }
  .dossier-head h2{
    font-family:var(--serif);
    font-size:30px;
    margin:0 0 4px;
  }
  .dossier-head .industry{
    color:var(--gold-deep);
    font-size:13.5px;
    font-weight:600;
    margin-bottom:22px;
  }
  .dossier-grid{
    display:grid;
    grid-template-columns: 1.3fr 1fr;
    gap:28px;
    margin-top:20px;
  }
  @media (max-width:640px){ .dossier-grid{ grid-template-columns:1fr; } }
  .dossier-block{ margin-bottom:24px; }
  .dossier-block h4{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin:0 0 8px;
    font-weight:600;
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
  }
  .dossier-block p, .dossier-block li{ font-size:14.5px; }
  .dossier-block ul{ margin:0; padding-left:18px; }
  .dossier-block li{ margin-bottom:6px; }
  .stat-row{ display:flex; gap:22px; flex-wrap:wrap; margin-top:4px; }
  .stat{ }
  .stat .v{ font-family:var(--serif); font-size:22px; color:var(--teal); }
  .stat .l{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .source-note{
    font-size:12px; color:var(--ink-soft); font-style:italic; margin-top:10px;
  }
  .ladder{ display:flex; flex-direction:column; gap:2px; margin-top:6px; }
  .ladder-step{
    display:flex; align-items:center; gap:10px;
    background:var(--paper); border:1px solid var(--line);
    padding:8px 12px; font-size:13.5px;
  }
  .ladder-emoji{ font-size:15px; }
  .ladder-label{ flex:1; }
  .ladder-pay{ font-weight:600; color:var(--navy); font-size:12.5px; white-space:nowrap; }
  .ladder-arrow{ text-align:center; font-size:12px; color:var(--ink-soft); }
  .intern-list{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); margin-top:6px;
  }
  @media (max-width:640px){ .intern-list{ grid-template-columns:1fr; } }
  .intern-card{ background:var(--paper-raised); padding:12px 14px; }
  .intern-top{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; margin-bottom:3px; gap:8px;
  }
  .intern-top span{ font-size:11px; color:var(--ink-soft); text-align:right; }
  .intern-role{ font-size:12.5px; color:var(--navy); margin-bottom:5px; }
  .intern-note{ font-size:12px; color:var(--ink-soft); line-height:1.4; }
  .alumni-card{
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    background:var(--paper-raised); border:1px solid var(--line); padding:14px 16px;
    flex-wrap:wrap;
  }
  .alumni-info strong{ font-size:14px; }
  .alumni-info p{ font-size:12.5px; color:var(--ink-soft); margin:4px 0 0; max-width:52ch; }
  .alumni-link{
    font-size:13px; font-weight:600; color:var(--navy); white-space:nowrap;
    border:1px solid var(--navy); padding:8px 14px; flex-shrink:0;
  }
  .alumni-link:hover{ background:var(--navy); color:var(--white); }
  .prep-cta{
    margin-top:8px;
    display:inline-block;
    background:var(--ink);
    color:var(--paper-raised);
    padding:11px 18px;
    font-size:14px;
    cursor:pointer;
    border:none;
  }
  .prep-cta:hover{ background:var(--gold-deep); }

  /* ---------- Interview Prep ---------- */
  .prep-picker h2{ font-family:var(--serif); font-size:22px; margin:0 0 6px; }
  .prep-picker p{ color:var(--ink-soft); font-size:14.5px; margin:0 0 24px; max-width:60ch;}
  .mode-toggle{ display:flex; gap:8px; margin-bottom:12px; }
  .mode-btn{
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    padding:9px 16px; font-size:13.5px; font-weight:600; font-family:var(--sans); cursor:pointer;
  }
  .mode-btn.active{ background:var(--navy); color:var(--white); border-color:var(--navy); }
  .mode-btn:hover:not(.active){ border-color:var(--navy); color:var(--navy); }
  .mode-desc{ color:var(--ink-soft); font-size:13.5px; margin:0 0 22px; max-width:60ch; }
  .role-pill-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .role-pill{
    border:1px solid var(--line);
    background:var(--paper);
    padding:10px 16px;
    font-size:14px;
    cursor:pointer;
  }
  .role-pill:hover{ border-color:var(--teal); color:var(--teal); }

  .interview-room{ display:none; }
  .interview-room.active{ display:block; }
  .ir-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:6px; flex-wrap:wrap; gap:8px;
  }
  .ir-head h2{ font-family:var(--serif); font-size:22px; margin:0; }
  .ir-progress{ font-size:12.5px; color:var(--ink-soft); }
  .interview-room.mock-mode #revealBtn{ display:none; }
  .answer-text-wrap{ display:block; }
  .interview-room.mock-mode .answer-text-wrap{ display:none; }
  .video-wrap{ display:none; }
  .interview-room.mock-mode .video-wrap{ display:block; margin-bottom:8px; }
  .cam-stage{
    position:relative; width:100%; max-width:420px;
    aspect-ratio:4/3; background:var(--navy-deep);
    border:1px solid var(--line); overflow:hidden;
  }
  .cam-stage video{
    width:100%; height:100%; object-fit:cover; display:none;
    background:var(--navy-deep);
  }
  .rec-indicator{
    position:absolute; top:10px; left:10px;
    display:none; align-items:center; gap:6px;
    background:rgba(8,28,59,.72); color:var(--white);
    font-family:var(--sans); font-weight:600; font-size:12.5px;
    padding:4px 10px;
  }
  .rec-indicator.active{ display:flex; }
  .rec-dot{
    width:8px; height:8px; border-radius:50%; background:#E23B3B;
    animation:recPulse 1.1s infinite;
  }
  @keyframes recPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }
  .video-actions{ display:flex; gap:10px; margin:12px 0 6px; flex-wrap:wrap; }
  .cam-note{ font-size:12px; color:var(--ink-soft); font-style:italic; margin:0 0 14px; }
  .live-caption{
    max-width:420px; min-height:34px; font-size:12.5px; color:var(--ink-soft);
    background:var(--paper); border-left:3px solid var(--line);
    padding:7px 10px; margin:8px 0 0; font-style:italic; line-height:1.4;
  }
  .live-caption:empty{ display:none; }
  .speech-support-note{
    font-size:13px; color:var(--ink-soft); max-width:60ch; margin:-8px 0 18px;
    background:var(--paper); border-left:3px solid var(--line); padding:9px 12px;
  }
  .mock-intro-error{
    font-size:13px; color:var(--danger); max-width:60ch; margin-top:6px; line-height:1.5;
  }
  .mock-intro-error code{
    background:var(--paper); border:1px solid var(--line); color:var(--ink);
    padding:1px 5px; font-size:12px; font-family:monospace;
  }
  .debrief-video{
    width:100%; max-width:420px; display:block; margin:10px 0 14px;
    border:1px solid var(--line); background:var(--navy-deep);
  }
  .q-type-badge{
    display:inline-block; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;
    padding:3px 9px; margin-bottom:14px; font-weight:600;
  }
  .q-type-badge.behavioral{ background:var(--teal-soft); color:var(--teal); }
  .q-type-badge.technical{ background:var(--navy); color:var(--white); }
  .q-text{ font-size:18px; font-family:var(--serif); margin:0 0 18px; line-height:1.4; }
  textarea{
    width:100%; min-height:120px; font-family:var(--sans); font-size:14.5px;
    border:1px solid var(--line); background:var(--paper); padding:12px;
    resize:vertical;
  }
  textarea:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  .ir-actions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .btn{
    border:none; padding:11px 18px; font-size:14px; cursor:pointer; font-family:var(--sans);
  }
  .btn-primary{ background:var(--ink); color:var(--paper-raised); }
  .btn-primary:hover{ background:var(--gold-deep); }
  .btn-ghost{ background:none; border:1px solid var(--line); color:var(--ink-soft); }
  .btn-ghost:hover{ border-color:var(--ink); color:var(--ink); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn:disabled:hover{ background:inherit; border-color:inherit; color:inherit; }

  .feedback-box{
    display:none;
    margin-top:22px;
    border-top:1px solid var(--line);
    padding-top:18px;
  }
  .feedback-box.active{ display:block; }
  .feedback-box h4{
    font-size:12px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); margin:0 0 8px;
  }
  .feedback-box .model-answer{ font-size:14.5px; margin-bottom:14px; }
  .feedback-box .tips{ font-size:13.5px; color:var(--ink-soft); }
  .feedback-box .tips li{ margin-bottom:5px; }
  .ir-done{
    display:none;
    text-align:center;
    padding:40px 10px;
  }
  .ir-done.active{ display:block; }
  .ir-done h2{ font-family:var(--serif); font-size:24px; margin:0 0 8px; }
  .ir-done p{ color:var(--ink-soft); font-size:14.5px; margin:0 0 20px;}

  .mock-intro{ display:none; padding:20px 0 10px; }
  .mock-intro.active{ display:block; }
  .mock-intro h2{ font-family:var(--serif); font-size:24px; margin:0 0 10px; }
  .mock-intro p{ color:var(--ink-soft); font-size:14.5px; max-width:60ch; margin:0 0 22px; line-height:1.55; }
  .mock-intro .btn{ margin-right:10px; }

  .mock-debrief{ display:none; }
  .mock-debrief.active{ display:block; }
  .debrief-head h2{ font-family:var(--serif); font-size:24px; margin:0 0 6px; }
  .debrief-head p{ color:var(--ink-soft); font-size:14px; margin:0 0 24px; max-width:65ch; }
  .debrief-item{ border-top:1px solid var(--line); padding:20px 0; }
  .debrief-item:first-child{ border-top:none; padding-top:0; }
  .debrief-q{ font-family:var(--serif); font-size:16px; margin:8px 0 12px; line-height:1.4; }
  .debrief-your{
    font-size:13.5px; margin:0 0 14px; padding:12px 14px;
    background:var(--paper); border-left:3px solid var(--navy); white-space:pre-wrap;
  }
  .debrief-your.empty{ color:var(--ink-soft); font-style:italic; border-left-color:var(--line); }
  .debrief-model, .debrief-tips{ margin-bottom:12px; }
  .debrief-model h5, .debrief-tips h5, .debrief-signals h5, .debrief-checklist h5{
    font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); margin:0 0 5px; font-weight:600;
  }
  .debrief-model p{ font-size:13.5px; margin:0; }
  .debrief-tips ul{ margin:0; padding-left:18px; font-size:12.5px; color:var(--ink-soft); }
  .debrief-tips li{ margin-bottom:4px; }
  .mock-debrief > .btn{ margin-top:8px; }

  .debrief-signals{
    margin-bottom:16px; background:var(--paper); border:1px solid var(--line); padding:12px 14px;
  }
  .debrief-signals .signals-note{ font-size:12px; color:var(--ink-soft); font-style:italic; margin:0; }
  .signal-stats{ display:flex; gap:18px; flex-wrap:wrap; margin:2px 0 10px; }
  .signal-stat{ font-size:12.5px; }
  .signal-stat .v{ font-family:var(--serif); font-size:17px; color:var(--navy); display:block; }
  .signal-stat .l{ color:var(--ink-soft); font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  .signal-fillers{ font-size:12.5px; color:var(--ink-soft); margin:0 0 8px; }
  .signal-chips{ display:flex; gap:6px; flex-wrap:wrap; margin:0; }
  .signal-chip{
    font-size:11.5px; padding:2px 8px; border:1px solid var(--line); color:var(--ink-soft);
  }
  .signal-chip.hit{ border-color:var(--navy); color:var(--navy); font-weight:600; }
  .debrief-checklist{ margin-bottom:14px; }
  .debrief-checklist ul{ list-style:none; margin:0; padding:0; }
  .debrief-checklist li{
    display:flex; align-items:flex-start; gap:8px; font-size:12.5px; color:var(--ink-soft);
    margin-bottom:6px; line-height:1.4;
  }
  .debrief-checklist input[type="checkbox"]{ margin-top:2px; flex-shrink:0; accent-color:var(--navy); }
  .debrief-checklist li.checked{ color:var(--ink); }

  footer.note{
    max-width:960px; margin:20px auto 0; padding:0 24px;
    font-size:12px; color:var(--ink-soft);
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand-inner">
    <div class="brand">
      <div class="brand-left">
